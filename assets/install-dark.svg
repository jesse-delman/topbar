<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.42"/></filter></defs>
  <rect width="1200" height="306" rx="28" fill="#111113"/>
  <text x="48" y="68" font-size="32" font-weight="700" fill="#F5F5F7" letter-spacing="-0.7">Up and running in seconds.</text>
  <rect x="48" y="114" width="352" height="156" rx="20" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1" filter="url(#sh)"/><circle cx="86" cy="154" r="18" fill="#15263B"/><text x="86" y="160" font-size="16" font-weight="700" fill="#0A84FF" text-anchor="middle">1</text><text x="116" y="160" font-size="17" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Download TopBar.exe</text><text x="72" y="204" font-size="14" font-weight="400" fill="#98989D">One 11 MB file. No installer, no</text><text x="72" y="226" font-size="14" font-weight="400" fill="#98989D">account, and no extra runtimes.</text><rect x="424" y="114" width="352" height="156" rx="20" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1" filter="url(#sh)"/><circle cx="462" cy="154" r="18" fill="#15263B"/><text x="462" y="160" font-size="16" font-weight="700" fill="#0A84FF" text-anchor="middle">2</text><text x="492" y="160" font-size="17" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Double-click to launch</text><text x="448" y="204" font-size="14" font-weight="400" fill="#98989D">If SmartScreen appears, click</text><text x="448" y="226" font-size="14" font-weight="400" fill="#98989D">More info → Run anyway.</text><rect x="800" y="114" width="352" height="156" rx="20" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1" filter="url(#sh)"/><circle cx="838" cy="154" r="18" fill="#15263B"/><text x="838" y="160" font-size="16" font-weight="700" fill="#0A84FF" text-anchor="middle">3</text><text x="868" y="160" font-size="17" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Ready right away</text><text x="824" y="204" font-size="14" font-weight="400" fill="#98989D">Starts with Windows, updates itself,</text><text x="824" y="226" font-size="14" font-weight="400" fill="#98989D">and keeps data in %APPDATA%\TopBar.</text>
</svg>
