<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" font-family="-apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15151B"/><stop offset="1" stop-color="#07070A"/></linearGradient>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5E8BFF"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient>
<linearGradient id="grey" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#55555F"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#5E8BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#5E8BFF" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>

</defs>
<rect width="1200" height="512" rx="28" fill="url(#bg)"/>
<rect width="1200" height="512" rx="28" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1199" height="511" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

<text x="64" y="92" font-size="26" font-weight="600" fill="#A1A1AA">Memory, with everything running</text>
<text x="64" y="178" font-size="96" font-weight="800" fill="url(#tb)" letter-spacing="-3">36× less</text>
<text x="64" y="218" font-size="24" fill="#D4D4D8">memory than the separate apps it replaces, running together.</text>
<text x="64" y="274" font-size="22" font-weight="600" fill="#FFFFFF">TopBar (bar, Search, widgets, taskbar, all of it)</text>
<rect x="64" y="288" width="1072" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04"/>
<rect x="64" y="288" width="29" height="34" rx="17" fill="url(#tb)"/>
<rect x="64" y="288" width="29" height="34" rx="17" fill="url(#tb)" opacity="0"/>
<text x="109" y="312" font-size="20" font-weight="700" fill="#FFFFFF" >25 MB</text>
<text x="64" y="370" font-size="22" font-weight="600" fill="#A1A1AA">The separate apps, running together</text>
<rect x="64" y="384" width="1072" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04"/>
<rect x="64" y="384" width="1072" height="34" rx="17" fill="url(#grey)"/>

<text x="1128" y="408" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="end">900 MB</text><text x="64" y="478" font-size="15" fill="#71717A">Approximate. Separate apps: launcher, widget engine, live wallpaper, screenshot tool, recorder, taskbar tool, volume mixer. Your numbers will vary.</text>
</svg>