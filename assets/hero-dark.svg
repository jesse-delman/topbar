<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.42"/></filter><filter id="sh_sm" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.42"/></filter></defs>
  <rect width="1200" height="620" rx="28" fill="#111113"/>

  <!-- Quiet editorial typography header -->
  <text x="600" y="76" font-size="16" font-weight="600" fill="#0A84FF" text-anchor="middle" letter-spacing="0.4">TOPBAR FOR WINDOWS 10 &amp; 11</text>
  <text x="600" y="140" font-size="56" font-weight="700" fill="#F5F5F7" text-anchor="middle" letter-spacing="-1.6">Every tool you use. One tiny app.</text>
  <text x="600" y="182" font-size="20" font-weight="400" fill="#98989D" text-anchor="middle">Mac-style menu bar, Spotlight search, desktop widgets, glass taskbar, and 22 built-in apps in 11 MB.</text>

  <!-- Minimalist desktop mockup showcase -->
  <rect x="72" y="220" width="1056" height="352" rx="22" fill="#18191D" stroke="#2C2C2E" stroke-width="1.5"/>

  <!-- Top Menu Bar -->
  <rect x="88" y="234" width="1024" height="34" rx="12" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1" filter="url(#sh_sm)"/>
  <circle cx="110" cy="251" r="6" fill="#0A84FF"/>
  <text x="128" y="256" font-size="13" font-weight="700" fill="#F5F5F7">TopBar</text>
  <text x="190" y="256" font-size="13" font-weight="500" fill="#98989D">File</text>
  <text x="228" y="256" font-size="13" font-weight="500" fill="#98989D">Edit</text>
  <text x="268" y="256" font-size="13" font-weight="500" fill="#98989D">View</text>
  <text x="314" y="256" font-size="13" font-weight="500" fill="#98989D">Window</text>
  <!-- Dynamic Island center pill -->
  <rect x="536" y="241" width="128" height="20" rx="10" fill="#000000"/>
  <circle cx="554" cy="251" r="4" fill="#30D158"/>
  <rect x="566" y="248" width="54" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.72"/>
  <rect x="630" y="247" width="3" height="8" rx="1.5" fill="#0A84FF"/>
  <rect x="636" y="245" width="3" height="12" rx="1.5" fill="#0A84FF"/>
  <rect x="642" y="248" width="3" height="6" rx="1.5" fill="#0A84FF"/>
  <!-- Right status cluster -->
  <text x="906" y="256" font-size="12" font-weight="500" fill="#98989D">CPU 1%</text>
  <text x="968" y="256" font-size="12" font-weight="500" fill="#98989D">25 MB</text>
  <text x="1032" y="256" font-size="13" font-weight="600" fill="#F5F5F7">9:41 AM</text>

  <!-- Left Desktop Widget Card (Weather) -->
  <rect x="104" y="294" width="210" height="162" rx="20" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1" filter="url(#sh)"/>
  <circle cx="144" cy="336" r="14" fill="#FF9F0A"/>
  <rect x="130" y="340" width="34" height="16" rx="8" fill="#0A84FF"/>
  <text x="128" y="400" font-size="38" font-weight="600" fill="#F5F5F7" letter-spacing="-1">72°</text>
  <text x="128" y="426" font-size="13" font-weight="500" fill="#98989D">Partly Cloudy · H:75° L:61°</text>

  <!-- Center Floating Spotlight Search Card -->
  <rect x="348" y="294" width="504" height="162" rx="22" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1.2" filter="url(#sh)"/>
  <!-- Search input row -->
  <circle cx="386" cy="332" r="9.5" fill="none" stroke="#0A84FF" stroke-width="2.6"/>
  <line x1="393" y1="339" x2="399" y2="345" stroke="#0A84FF" stroke-width="2.6" stroke-linecap="round"/>
  <text x="412" y="338" font-size="18" font-weight="500" fill="#F5F5F7">240 km to miles</text>
  <rect x="760" y="317" width="70" height="28" rx="14" fill="#15263B"/>
  <text x="795" y="336" font-size="12" font-weight="600" fill="#0A84FF" text-anchor="middle">Enter</text>
  <line x1="368" y1="364" x2="832" y2="364" stroke="#2C2C2E" stroke-width="1"/>
  <!-- Instant Top Hit result row -->
  <rect x="366" y="376" width="468" height="64" rx="14" fill="#242426" stroke="#2C2C2E" stroke-width="1"/>
  <rect x="382" y="388" width="40" height="40" rx="11" fill="#0A84FF"/>
  <text x="402" y="414" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">⇄</text>
  <text x="436" y="406" font-size="16" font-weight="600" fill="#F5F5F7">149.13 miles</text>
  <text x="436" y="426" font-size="13" font-weight="400" fill="#98989D">Conversion · Press Enter to copy</text>

  <!-- Right Desktop Widget Card (Now Playing / Stats) -->
  <rect x="886" y="294" width="210" height="162" rx="20" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1" filter="url(#sh)"/>
  <text x="910" y="328" font-size="12" font-weight="600" fill="#98989D" letter-spacing="0.4">SYSTEM</text>
  <text x="910" y="370" font-size="30" font-weight="700" fill="#F5F5F7" letter-spacing="-0.8">~0%</text>
  <text x="984" y="370" font-size="14" font-weight="500" fill="#98989D">idle CPU</text>
  <rect x="910" y="394" width="162" height="8" rx="4" fill="#2C2C2E"/>
  <rect x="910" y="394" width="22" height="8" rx="4" fill="#30D158"/>
  <text x="910" y="430" font-size="13" font-weight="500" fill="#98989D">25 MB RAM · 11 MB file</text>

  <!-- Bottom Floating Glass Taskbar / Dock -->
  <rect x="372" y="494" width="456" height="58" rx="22" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1.2" filter="url(#sh)"/>
  <rect x="394" y="505" width="36" height="36" rx="10" fill="#FF453A"/>
  <rect x="444" y="505" width="36" height="36" rx="10" fill="#0A84FF"/>
  <rect x="494" y="505" width="36" height="36" rx="10" fill="#FF9F0A"/>
  <rect x="544" y="505" width="36" height="36" rx="10" fill="#30D158"/>
  <rect x="594" y="505" width="36" height="36" rx="10" fill="#AF52DE"/>
  <rect x="644" y="505" width="36" height="36" rx="10" fill="#32ADE6"/>
  <line x1="696" y1="511" x2="696" y2="535" stroke="#38383A" stroke-width="1.5"/>
  <rect x="712" y="505" width="36" height="36" rx="10" fill="#FF375F"/>
  <rect x="762" y="505" width="36" height="36" rx="10" fill="#8E8E93"/>
  <circle cx="462" cy="547" r="2.2" fill="#0A84FF"/>
  <circle cx="562" cy="547" r="2.2" fill="#0A84FF"/>
</svg>
