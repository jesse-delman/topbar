<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="-apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15151B"/><stop offset="1" stop-color="#07070A"/></linearGradient>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5E8BFF"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF5FA2"/></linearGradient>
<linearGradient id="grey" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#55555F"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#5E8BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#5E8BFF" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>

</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1199" height="419" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

<text x="600" y="150" text-anchor="middle" font-size="78" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Every tool you use.</text>
<text x="600" y="240" text-anchor="middle" font-size="78" font-weight="800" fill="url(#tb)" letter-spacing="-2">One tiny app.</text>
<text x="600" y="305" text-anchor="middle" font-size="26" fill="#A1A1AA">A glass menu bar, Search, widgets, taskbar and 19 built-in apps for Windows.</text>
<g font-size="20" font-weight="600" fill="#FFFFFF">
<rect x="318" y="335" width="170" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="403" y="364" text-anchor="middle">6 MB download</text>
<rect x="510" y="335" width="180" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="600" y="364" text-anchor="middle">~25 MB memory</text>
<rect x="712" y="335" width="170" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/><text x="797" y="364" text-anchor="middle">~0% CPU idle</text>
</g>
</svg>