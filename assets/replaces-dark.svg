<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.42"/></filter></defs>
  <rect width="1200" height="510" rx="28" fill="#111113"/>
  <text x="48" y="72" font-size="34" font-weight="700" fill="#F5F5F7" letter-spacing="-0.8">Replaces 30 separate utilities.</text>
  <text x="48" y="106" font-size="18" font-weight="400" fill="#98989D">Everything shares one 11 MB native Windows executable — no Electron, no browser engine.</text>
